  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const FPS = 30;
    const f = (frame) => frame / FPS; // frame-to-seconds helper

    // ─── Title card data ───
    const TITLE_CARDS = {
      card1: { text: "All your team's research, *one* place to go." },
      card2: { text: "Paper *Radar,* tailored for your morning reading.", sub: "of 31 fetched today", subDigits: "5" },
      cardWbr: { text: "Every project, *linked* to your weekly report." },
      card3: { text: "The whole team, on the *same* page." },
    };

    const parseWords = (text) =>
      text.split(/\s+/).filter(Boolean).map((w) => {
        const m = w.match(/^\*(.+)\*$/);
        return m ? { text: m[1], accent: true } : { text: w };
      });

    // ─── Populate title card words ───
    function buildTitleCard(containerId, underlineId, cardKey) {
      const container = document.getElementById(containerId);
      const words = parseWords(TITLE_CARDS[cardKey].text);
      words.forEach((w, i) => {
        const span = document.createElement("span");
        span.className = "title-card-word" + (w.accent ? " title-card-accent" : "");
        span.textContent = w.text;
        span.id = `${containerId}-w${i}`;
        span.style.opacity = "0";
        span.style.transform = "scale(1.28)";
        span.style.filter = "blur(7px)";
        container.appendChild(span);
      });
    }

    buildTitleCard("card1-text", "card1-underline", "card1");
    buildTitleCard("card2-text", "card2-underline", "card2");
    buildTitleCard("cardWbr-text", "cardWbr-underline", "cardWbr");
    buildTitleCard("card3-text", "card3-underline", "card3");

    // ─── Populate wordmark characters ───
    const WORDMARK = "AI Foundation Lab";
    const wordmarkEl = document.getElementById("wordmark");
    WORDMARK.split("").forEach((ch, i) => {
      const span = document.createElement("span");
      span.className = "wordmark-char";
      span.textContent = ch === " " ? "\u00A0" : ch;
      span.id = `wm-${i}`;
      span.style.opacity = "0";
      span.style.transform = "scale(1.6)";
      span.style.filter = "blur(6px)";
      // glint bar
      const glint = document.createElement("span");
      glint.className = "wordmark-glint";
      glint.id = `wm-glint-${i}`;
      glint.style.width = "0%";
      glint.style.opacity = "0";
      span.appendChild(glint);
      wordmarkEl.appendChild(span);
    });

    // ════════════════════════════════════════════════════════════════════
    //  BRAND OPEN (0–2.53s brand, 2.53s brand rest, ~2.77s dissolve)
    // ════════════════════════════════════════════════════════════════════

    // Crosshair draw-on
    CustomEase.create("drawEase", "M0,0 C0.3,0 0.2,1 1,1");
    tl.to("#cross-v", { attr: { "stroke-dashoffset": 0 }, duration: f(9), ease: "drawEase" }, 0);
    tl.to("#cross-h", { attr: { "stroke-dashoffset": 0 }, duration: f(10), ease: "none" }, f(8));

    // Crosshair fade
    tl.to(".crosshair", { opacity: 0, duration: f(10) }, f(24));

    // Wordmark letterpress (glyph-by-glyph)
    WORDMARK.split("").forEach((ch, i) => {
      const delay = f(10 + i * 3);
      tl.to(`#wm-${i}`, { opacity: 1, scale: 1, filter: "blur(0px)", duration: f(12), ease: "power2.out" }, delay);
      // Glint under each glyph
      const glintCenter = delay + f(12);
      tl.fromTo(`#wm-glint-${i}`,
        { width: "0%", opacity: 0 },
        { width: "100%", opacity: 1, duration: f(4), ease: "none" },
        glintCenter - f(4)
      );
      tl.to(`#wm-glint-${i}`, { width: "0%", opacity: 0, duration: f(4), ease: "none" }, glintCenter);
    });

    // Kicker typewriter
    const KICKER = "TEAM RESEARCH CONSOLE";
    const kickerText = document.getElementById("kicker-text");
    const kickerCursor = document.getElementById("kicker-cursor");
    KICKER.split("").forEach((ch, i) => {
      const charTime = f(28 + i * 0.7);
      tl.call(() => { kickerText.textContent = KICKER.slice(0, i + 1); }, [], charTime);
    });
    tl.to("#kicker-cursor", { opacity: 0.85, duration: 0.01 }, f(28));

    // Brand group dissolve out (76→83 frames = 2.533→2.767s)
    tl.to("#brand-group", {
      opacity: 0, y: -40, scale: 0.88,
      duration: f(7), ease: "power2.in"
    }, f(76));

    // Macro scene fade in (82→90 frames)
    tl.to("#macro-scene", { opacity: 1, duration: f(8), ease: "power2.out" }, f(82));

    // ════════════════════════════════════════════════════════════════════
    //  TITLE CARDS — word entrance + underline grow
    // ════════════════════════════════════════════════════════════════════

    function animateTitleCard(cardStart, cardDuration, container, underline, digitEl, digitSub) {
      var words = container.querySelectorAll(".title-card-word");
      words.forEach(function(w, i) {
        var delay = cardStart + f(4 + i * 4);
        tl.to(w, {
          opacity: 1, scale: 1, filter: "blur(0px)",
          duration: f(9), ease: "power2.out"
        }, delay);
      });
      if (underline) {
        tl.to(underline, {
          scaleX: 1, duration: f(18), ease: "power2.inOut"
        }, cardStart + f(16));
      }
      tl.to(container, { opacity: 0, duration: f(8) }, cardStart + cardDuration - f(8));
      if (underline) {
        tl.to(underline, { opacity: 0, duration: f(8) }, cardStart + cardDuration - f(8));
      }
      if (digitEl) {
        var counter = { v: 0 };
        tl.to(counter, {
          v: 5, duration: f(10), ease: "power3.out",
          onUpdate: function() {
            digitEl.textContent = Math.round(counter.v).toString();
          }
        }, cardStart + f(12));
        tl.to(digitEl, { opacity: 1, duration: f(12) }, cardStart + f(10));
        if (digitSub) tl.to(digitSub, { opacity: 1, duration: f(12) }, cardStart + f(10));
      }
    }

    animateTitleCard(f(220), f(55),
      document.getElementById("card1-text"),
      document.getElementById("card1-underline"));
    animateTitleCard(f(565), f(55),
      document.getElementById("card2-text"),
      document.getElementById("card2-underline"),
      document.getElementById("card2-digit"),
      document.getElementById("card2-sub"));
    animateTitleCard(f(725), f(50),
      document.getElementById("cardWbr-text"),
      document.getElementById("cardWbr-underline"));
    animateTitleCard(f(885), f(55),
      document.getElementById("card3-text"),
      document.getElementById("card3-underline"));

    // ════════════════════════════════════════════════════════════════════
    //  CAPTIONS — fade in/out
    // ════════════════════════════════════════════════════════════════════

    document.querySelectorAll(".caption-strip").forEach((cap) => {
      const start = parseFloat(cap.dataset.start);
      const dur = parseFloat(cap.dataset.duration);
      tl.fromTo(cap,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: f(8), ease: "power2.out" },
        start
      );
      tl.to(cap, { opacity: 0, duration: f(8), ease: "power2.in" }, start + dur - f(8));
    });

    // ════════════════════════════════════════════════════════════════════
    //  FLASH CUTS — warm bloom
    // ════════════════════════════════════════════════════════════════════

    document.querySelectorAll(".flash-cut").forEach((flash) => {
      const start = parseFloat(flash.dataset.start);
      const dur = parseFloat(flash.dataset.duration);
      tl.fromTo(flash,
        { opacity: 0 },
        { opacity: 0.85, duration: dur * 0.4, ease: "none" },
        start
      );
      tl.to(flash, { opacity: 0, duration: dur * 0.6, ease: "none" }, start + dur * 0.4);
    });

    // ════════════════════════════════════════════════════════════════════
    //  OUTRO — wordmark stamp + tagline
    // ════════════════════════════════════════════════════════════════════

    const outroStart = f(940);
    tl.to("#outro-wordmark", { opacity: 1, duration: f(12), ease: "power3.out" }, outroStart + f(20));
    tl.from("#outro-wordmark", { scale: 1.15, filter: "blur(4px)", duration: f(12), ease: "power3.out" }, outroStart + f(20));
    tl.to("#outro-tagline", { opacity: 1, duration: f(10), ease: "power2.out" }, outroStart + f(40));
    tl.from("#outro-tagline", { y: 20, duration: f(10), ease: "power2.out" }, outroStart + f(40));

    // ────────────────────────────────────────────────────────────────────
    //  Register timeline
    // ────────────────────────────────────────────────────────────────────
    window.__timelines["AiflPromo"] = tl;
  </script>
</body>
</html>
