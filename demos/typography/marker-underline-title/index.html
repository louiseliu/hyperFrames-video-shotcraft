<!-- marker-underline-title -->
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-composition-id="MarkerUnderlineTitle"] { width: 1920px; height: 1080px; background: #f4f4f2; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div data-composition-id="MarkerUnderlineTitle" data-start="0" data-duration="1.5" data-fps="30" data-width="1920" data-height="1080" id="comp"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const mulberry32=a=>()=>{let t=(a+=0x6d2b79f5);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
    const buildStroke=(len,seed)=>{const rand=mulberry32(seed),N=40,top=[],bot=[],wob=Array.from({length:N+1},()=>rand()-0.5);
      for(let i=0;i<=N;i++){const t=i/N,x=t*len,mid=19-t*9+Math.sin(t*Math.PI*1.6+0.4)*2.6+wob[i]*1.6,wBase=14+Math.sin(t*Math.PI)*6-Math.max(0,t-0.86)*46,w=Math.max(2.2,wBase+wob[i]*3);
        top.push(`${x.toFixed(1)},${(mid-w/2).toFixed(1)}`);bot.push(`${x.toFixed(1)},${(mid+w/2).toFixed(1)}`);}return `M${top.join('L')}L${bot.reverse().join('L')}Z`;};
    const LEN=252, PATH=buildStroke(LEN,77), TOTAL=45, revealId='reveal-marker';
    const clamp=(f,a,b,va,vb)=>{let t=(f-a)/(b-a);t=Math.max(0,Math.min(1,t));return va+(vb-va)*t;};
    const comp=document.getElementById('comp'); const tl=gsap.timeline({paused:true}); const state={t:0};
    tl.to(state,{t:1,duration:TOTAL/30,ease:'none',onUpdate:()=>{
      const frame=Math.min(TOTAL-1,Math.round(state.t*(TOTAL-1)));
      const enter=clamp(frame,0,22,0,1), eo=1-Math.pow(1-enter,3), titleY=(1-eo)*36, titleOp=Math.min(1,enter*1.6);
      const draw=clamp(frame,32,42,0,1), drawE=1-Math.pow(1-draw,2.2);
      comp.innerHTML=`<div style="opacity:${titleOp};transform:translateY(${titleY}px);font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:118px;color:#191919;text-align:center;line-height:1.12;letter-spacing:-0.02em">
        <div>Meet the <span style="font-style:italic;position:relative;display:inline-block">new
          <svg width="${LEN}" height="44" viewBox="0 0 ${LEN} 44" style="position:absolute;left:-12px;bottom:-20px;overflow:visible">
            <defs><clipPath id="${revealId}"><rect x="0" y="-20" width="${drawE*(LEN+6)}" height="60"/></clipPath></defs>
            ${draw>0?`<path d="${PATH}" fill="#111111" clip-path="url(#${revealId})"/>`:''}
          </svg></span></div><div>Notion AI</div></div>`;
    }},0);
    window.__timelines['MarkerUnderlineTitle']=tl;
  </script>
</body>
</html>
