<!-- countdown-arc-scatter -->
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-composition-id="CountdownArcScatter"] { background: #fff; overflow: hidden; }
    .design-stage { position:absolute;left:0;top:0;width:480px;height:270px;overflow:hidden;transform:scale(4);transform-origin:top left; }
    #stage { position:absolute;inset:0;background:#fff;overflow:hidden;font-family:-apple-system,system-ui,sans-serif; }
  </style>
</head>
<body>
  <div data-composition-id="CountdownArcScatter" data-start="0" data-duration="1.1" data-fps="30" data-width="1920" data-height="1080">
    <div class="design-stage"><div id="stage"></div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const E={linear:t=>t,outCubic:t=>1-Math.pow(1-t,3),inOutCubic:t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,inQuad:t=>t*t,outQuad:t=>t*(2-t)};
    const lerp=(t,a,b)=>a+(b-a)*t; const seg=(t,t0,t1,e=E.linear)=>e(Math.min(1,Math.max(0,(t-t0)/(t1-t0))));
    const mix=(k,a,b)=>Math.round(lerp(k,a,b));
    const INK='#17181c', ACC=[59,130,246], R0=150, SP=24, NUMS=[45,35,28,22,17,10,5,4,3], TARGET={x:-148,y:-30};
    const WORDS=[{text:'min',mr:11,win:[0.54,0.68]},{text:'to',mr:11,win:[0.62,0.78]},{text:'install',mr:0,win:[0.7,0.9]}];
    const NF={color:INK,fontWeight:600,fontSize:40,letterSpacing:'-0.5px',whiteSpace:'nowrap'};
    const stage=document.getElementById('stage'); const tl=gsap.timeline({paused:true}); const state={t:0};
    tl.to(state,{t:1,duration:1.1,ease:'none',onUpdate:()=>{
      const t=state.t, rot=lerp(seg(t,0,0.52,E.outCubic),96,0), hand=seg(t,0.52,0.7,E.inOutCubic), out=seg(t,0.5,0.7,E.inQuad), bl=seg(t,0.84,0.98);
      let nums=''; NUMS.forEach((n,i)=>{const is5=n===5,pa=(i-6)*SP+rot,rad=pa*Math.PI/180; let x=Math.sin(rad)*R0,y=-Math.cos(rad)*R0,rSelf=pa,op=Math.max(0,Math.min(1,(70-Math.abs(pa))/22));
        if(is5){x=lerp(hand,x,TARGET.x);y=lerp(hand,y,TARGET.y);rSelf*=1-hand;} else op*=1-out;
        nums+=`<div style="position:absolute;left:0;top:0;opacity:${op};transform:translate(-50%,-50%) translate(${x}px,${y}px) rotate(${rSelf}deg);${is5?'':'filter:blur('+(out*3)+'px);'}color:${INK};font-weight:600;font-size:40px;letter-spacing:-0.5px;white-space:nowrap">${n}</div>`;});
      const title=WORDS.map(({text,mr,win},k)=>{const p=seg(t,win[0],win[1],E.outCubic),isLast=k===WORDS.length-1;
        const col=isLast?`rgb(${mix(bl,23,ACC[0])},${mix(bl,24,ACC[1])},${mix(bl,28,ACC[2])})`:INK;
        return `<span style="display:inline-block;margin-right:${mr||0}px;opacity:${p};filter:blur(${(1-p)*6}px);color:${col}">${text}</span>`;}).join('');
      stage.innerHTML=`<div style="position:absolute;left:50%;top:58%;width:0;height:0">${nums}
        <div style="position:absolute;left:0;top:0;width:0;height:0;transform:rotate(${rot*0.35}deg)"><div style="position:absolute;left:-1.5px;top:-101px;width:3px;height:26px;border-radius:2px;background:${INK};opacity:${1-out}"></div></div>
        <div style="position:absolute;left:-124px;top:-30px;transform:translateY(-50%);color:${INK};font-weight:600;font-size:40px;letter-spacing:-0.5px;white-space:nowrap">${title}</div></div>`;
    }},0);
    window.__timelines['CountdownArcScatter']=tl;
  </script>
</body>
</html>
